<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLT RUNNER 01: drop</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#ededed; color:#0b0b0b; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow-x:hidden; }
  .ticker { background:#0b0b0b; color:#ededed; white-space:nowrap; overflow:hidden; font-weight:700; font-size:13px; letter-spacing:.2em; padding:8px 0; }
  .ticker span { display:inline-block; animation: slide 22s linear infinite; }
  @keyframes slide { to { transform: translateX(-50%); } }
  .hero { display:grid; grid-template-columns: 1fr 1fr; min-height:86vh; }
  .left { padding:6vw 5vw; display:flex; flex-direction:column; justify-content:space-between; }
  .drop { font-weight:700; letter-spacing:.3em; font-size:13px; }
  h1 { font-size: clamp(64px, 11vw, 170px); line-height:.82; font-weight:900; letter-spacing:-.05em; }
  .right { background:#ff3b00; position:relative; display:grid; place-items:center; overflow:hidden; }
  .num { position:absolute; font-size:42vw; font-weight:900; color:#ff6a3d; line-height:.7; letter-spacing:-.06em; right:-4vw; bottom:-6vw; }
  .shoe { position:relative; width:72%; aspect-ratio:2.2; }
  .sole { position:absolute; left:2%; right:0; bottom:0; height:22%; background:#ededed; border-radius: 10px 30px 40px 40px; }
  .upper { position:absolute; left:8%; right:6%; bottom:18%; height:62%; background:#0b0b0b; border-radius: 60% 80% 20% 30% / 90% 90% 20% 20%; }
  .bolt { position:absolute; left:38%; bottom:24%; width:22%; height:52%; background:#c6ff00; clip-path: polygon(55% 0, 15% 55%, 45% 55%, 30% 100%, 85% 40%, 55% 40%, 75% 0); }
  .bottom { display:flex; gap:20px; align-items:end; flex-wrap:wrap; }
  .clock { font-size:34px; font-weight:900; font-variant-numeric: tabular-nums; letter-spacing:-.02em; }
  .sizes { display:flex; gap:6px; flex-wrap:wrap; margin-top:18px; }
  .sizes button { width:52px; height:44px; border:2px solid #0b0b0b; background:transparent; font-weight:700; cursor:pointer; }
  .sizes button[aria-pressed="true"] { background:#0b0b0b; color:#ededed; }
  .notify { background:#0b0b0b; color:#ededed; border:0; padding:18px 26px; font-weight:900; letter-spacing:.1em; cursor:pointer; }
  #msg { font-weight:700; min-height:1.3em; }
  @media (max-width: 820px) { .hero { grid-template-columns:1fr; } .right { min-height:48vh; } }
  @media (prefers-reduced-motion: reduce) { .ticker span { animation:none; } }
</style>
</head>
<body>
<div class="ticker" aria-hidden="true"><span>DROP 01 ★ 400 PAIRS ★ NO RESTOCK ★ ONE PER PERSON ★ DROP 01 ★ 400 PAIRS ★ NO RESTOCK ★ ONE PER PERSON ★ DROP 01 ★ 400 PAIRS ★ NO RESTOCK ★ ONE PER PERSON ★ DROP 01 ★ 400 PAIRS ★ NO RESTOCK ★ ONE PER PERSON ★ </span></div>
<section class="hero">
  <div class="left">
    <p class="drop">VOLT / DROP 01 / SATURDAY 10:00</p>
    <h1>VOLT<br>RUNNER</h1>
    <div>
      <div class="bottom"><div><p class="drop">DROPS IN</p><p class="clock" id="clock">00:00:00</p></div></div>
      <div class="sizes" role="group" aria-label="Size">
        <button type="button" aria-pressed="false">7</button><button type="button" aria-pressed="false">8</button><button type="button" aria-pressed="true">9</button><button type="button" aria-pressed="false">10</button><button type="button" aria-pressed="false">11</button><button type="button" aria-pressed="false">12</button>
      </div>
      <div class="bottom" style="margin-top:18px"><button type="button" class="notify" id="notify">NOTIFY ME</button><p id="msg" role="status"></p></div>
    </div>
  </div>
  <div class="right" aria-hidden="true"><div class="num">01</div><div class="shoe"><div class="upper"></div><div class="bolt"></div><div class="sole"></div></div></div>
</section>
<script>
  var end = Date.now() + 1000 * (3600 * 38 + 60 * 12);
  function tick() { var t = Math.max(0, end - Date.now()) / 1000, p = function (n) { return String(Math.floor(n)).padStart(2, "0"); };
    document.getElementById("clock").textContent = p(t / 3600) + ":" + p(t % 3600 / 60) + ":" + p(t % 60); }
  tick(); setInterval(tick, 1000);
  document.querySelectorAll(".sizes button").forEach(function (b) { b.onclick = function () { document.querySelectorAll(".sizes button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }; });
  document.getElementById("notify").onclick = function () { var s = document.querySelector('.sizes [aria-pressed="true"]'); document.getElementById("msg").textContent = "SIZE " + s.textContent + " SAVED. WE'LL PING YOU."; };
</script>
</body>
</html>
