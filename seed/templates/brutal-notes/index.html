<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTES.</title>
<style>
  * { box-sizing:border-box; margin:0; border-radius:0; }
  body { background:#f2f2f2; color:#000; font-family: "Courier New", Courier, monospace; padding:24px; }
  h1 { font-family: "Arial Black", Arial, sans-serif; font-size: clamp(56px, 12vw, 140px); line-height:.85; letter-spacing:-.04em; }
  .bar { display:flex; gap:0; margin:24px 0; border:4px solid #000; background:#fff; }
  textarea { flex:1; border:0; padding:16px; font: 18px "Courier New", monospace; resize:vertical; min-height:80px; outline:none; }
  textarea:focus { background:#fffbe6; }
  .bar button { border:0; border-left:4px solid #000; background:#ff4d00; color:#000; font: 900 20px "Arial Black", Arial, sans-serif; padding:0 26px; cursor:pointer; }
  .bar button:hover { background:#000; color:#ff4d00; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:18px; }
  .note { background:#fff; border:4px solid #000; box-shadow: 8px 8px 0 #000; padding:16px; position:relative; min-height:140px; white-space:pre-wrap; word-break:break-word; font-size:16px; }
  .note:nth-child(3n+1) { background:#d4ff00; } .note:nth-child(3n+2) { background:#00e5ff; }
  .note time { display:block; font-size:12px; margin-top:12px; opacity:.7; }
  .note .x { position:absolute; top:-4px; right:-4px; border:4px solid #000; background:#000; color:#fff; width:34px; height:34px; cursor:pointer; font: 900 18px Arial, sans-serif; }
  .empty { border:4px dashed #000; padding:30px; font-size:18px; }
  .meta { margin-top:30px; font-size:13px; }
</style>
</head>
<body>
<h1>NOTES.</h1>
<div class="bar">
  <label for="t" style="position:absolute;left:-9999px">New note</label>
  <textarea id="t" placeholder="TYPE SOMETHING. ⌘+ENTER TO SAVE."></textarea>
  <button type="button" id="add">ADD</button>
</div>
<div class="grid" id="grid"></div>
<p class="meta" id="meta"></p>
<script>
  var store = (function () { try { localStorage.setItem("x", "1"); localStorage.removeItem("x"); return localStorage; } catch (e) { return null; } })();
  var notes = [{ text: "BUY: TAPE, MORE TAPE.", at: Date.now() - 864e5 }, { text: "Idea: a website that is just one enormous button.", at: Date.now() - 36e5 }];
  if (store && store.getItem("brutal-notes")) { try { notes = JSON.parse(store.getItem("brutal-notes")); } catch (e) {} }
  document.getElementById("meta").textContent = store ? "SAVED LOCALLY." : "PREVIEW MODE: NOTES VANISH ON RELOAD.";
  function save() { if (store) store.setItem("brutal-notes", JSON.stringify(notes)); }
  function render() {
    var g = document.getElementById("grid");
    g.innerHTML = notes.length ? "" : '<div class="empty">NOTHING HERE. WRITE SOMETHING.</div>';
    notes.slice().reverse().forEach(function (n, i) {
      var el = document.createElement("div"); el.className = "note"; el.textContent = n.text;
      var t = document.createElement("time"); t.textContent = new Date(n.at).toLocaleString(); el.appendChild(t);
      var x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Delete note");
      x.onclick = function () { notes.splice(notes.length - 1 - i, 1); save(); render(); };
      el.appendChild(x); g.appendChild(el);
    });
  }
  function add() { var t = document.getElementById("t"); if (!t.value.trim()) return; notes.push({ text: t.value.trim(), at: Date.now() }); t.value = ""; save(); render(); }
  document.getElementById("add").onclick = add;
  document.getElementById("t").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) add(); });
  render();
</script>
</body>
</html>
