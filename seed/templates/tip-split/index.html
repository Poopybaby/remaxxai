<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPLIT IT: bill and tip calculator</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#0d0d0d; color:#fff; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; min-height:100vh; display:grid; place-items:center; padding:20px; }
  .calc { width:min(440px, 100%); background:#1a1a1a; border-radius:28px; padding:28px; }
  h1 { font-size:44px; line-height:.9; color:#c6ff00; }
  label { display:block; font: 700 13px Arial, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#999; margin:22px 0 8px; }
  input { width:100%; background:#0d0d0d; border:3px solid #333; color:#fff; font: 900 32px "Arial Black", Arial, sans-serif; padding:12px 14px; border-radius:14px; }
  input:focus { border-color:#c6ff00; outline:none; }
  .tips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tips button { background:#0d0d0d; color:#fff; border:3px solid #333; border-radius:12px; padding:12px 0; font: 900 18px "Arial Black", Arial, sans-serif; cursor:pointer; }
  .tips button[aria-pressed="true"] { background:#c6ff00; color:#0d0d0d; border-color:#c6ff00; }
  .people { display:flex; align-items:center; gap:12px; }
  .people button { width:52px; height:52px; border-radius:50%; border:0; background:#333; color:#fff; font-size:26px; cursor:pointer; }
  #people { font-size:36px; min-width:2ch; text-align:center; }
  .out { margin-top:26px; background:#c6ff00; color:#0d0d0d; border-radius:20px; padding:20px 22px; display:grid; gap:6px; }
  .out div { display:flex; justify-content:space-between; font: 700 15px Arial, sans-serif; }
  .out .big { font: 900 40px "Arial Black", Arial, sans-serif; }
</style>
</head>
<body>
<main class="calc">
  <h1>SPLIT<br>IT.</h1>
  <label for="bill">Bill total</label>
  <input id="bill" inputmode="decimal" value="86.40">
  <label id="tiplbl">Tip</label>
  <div class="tips" role="group" aria-labelledby="tiplbl">
    <button type="button" data-t="0" aria-pressed="false">0%</button><button type="button" data-t="15" aria-pressed="false">15%</button><button type="button" data-t="18" aria-pressed="true">18%</button><button type="button" data-t="22" aria-pressed="false">22%</button>
  </div>
  <label id="plbl">People</label>
  <div class="people" role="group" aria-labelledby="plbl"><button type="button" id="less" aria-label="Fewer people">−</button><span id="people">3</span><button type="button" id="more" aria-label="More people">+</button></div>
  <section class="out" aria-live="polite">
    <div><span>EACH PAYS</span><span id="tipeach"></span></div>
    <div class="big" id="each"></div>
    <div><span>TOTAL WITH TIP</span><span id="total"></span></div>
  </section>
</main>
<script>
  var tip = 18, people = 3, money = function (n) { return "$" + n.toFixed(2); };
  function calc() {
    var bill = parseFloat(document.getElementById("bill").value.replace(/[^0-9.]/g, "")) || 0, total = bill * (1 + tip / 100);
    document.getElementById("people").textContent = people;
    document.getElementById("each").textContent = money(total / people);
    document.getElementById("tipeach").textContent = "incl. " + money(bill * tip / 100 / people) + " tip";
    document.getElementById("total").textContent = money(total);
  }
  document.querySelectorAll(".tips button").forEach(function (b) { b.onclick = function () { tip = +b.dataset.t; document.querySelectorAll(".tips button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); calc(); }; });
  document.getElementById("more").onclick = function () { if (people < 30) { people++; calc(); } };
  document.getElementById("less").onclick = function () { if (people > 1) { people--; calc(); } };
  document.getElementById("bill").oninput = calc;
  calc();
</script>
</body>
</html>
