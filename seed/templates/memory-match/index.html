<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Match: memory game</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { background:#fff4d6; color:#3b2a1a; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; min-height:100vh; padding:28px 16px; text-align:center; }
  h1 { font-size:40px; color:#ff6b35; text-shadow: 3px 3px 0 #3b2a1a; }
  .hud { margin:10px 0 22px; font-size:18px; }
  .board { display:grid; grid-template-columns: repeat(4, minmax(64px, 110px)); gap:12px; justify-content:center; }
  .card { aspect-ratio:1; border:0; border-radius:20px; cursor:pointer; font-size:40px; background:#6c63ff; color:transparent; box-shadow: 0 6px 0 #4b43c9; transition: transform .25s; }
  .card.up, .card.done { background:#fff; color:inherit; transform: rotateY(180deg) ; }
  .card.done { background:#c7f9cc; box-shadow: 0 6px 0 #80c98a; cursor:default; }
  .card span { display:inline-block; transform: rotateY(180deg); }
  button.again { margin-top:22px; background:#ff6b35; color:#fff; border:0; border-radius:999px; padding:14px 28px; font: bold 18px inherit; font-family:inherit; cursor:pointer; box-shadow: 0 5px 0 #c44a1d; }
  #msg { min-height:1.5em; margin-top:14px; font-size:20px; }
  @media (prefers-reduced-motion: reduce) { .card { transition:none; } }
</style>
</head>
<body>
<h1>Snack Match</h1>
<p class="hud">Moves: <b id="moves">0</b> · Pairs: <b id="pairs">0</b>/8</p>
<div class="board" id="board" aria-label="Cards"></div>
<p id="msg" role="status"></p>
<button class="again" type="button" id="again">Shuffle again</button>
<script>
  var snacks = ["🍩", "🍕", "🌮", "🍓", "🧁", "🍉", "🥨", "🍪"], first = null, lock = false, moves = 0, pairs = 0;
  function deal() {
    var deck = snacks.concat(snacks).sort(function () { return Math.random() - .5; });
    var b = document.getElementById("board"); b.innerHTML = ""; moves = 0; pairs = 0; first = null; update("");
    deck.forEach(function (s) {
      var c = document.createElement("button"); c.type = "button"; c.className = "card"; c.dataset.s = s; c.setAttribute("aria-label", "Hidden card");
      c.innerHTML = "<span>" + s + "</span>"; c.onclick = function () { flip(c); }; b.appendChild(c);
    });
  }
  function update(msg) { document.getElementById("moves").textContent = moves; document.getElementById("pairs").textContent = pairs; document.getElementById("msg").textContent = msg; }
  function flip(c) {
    if (lock || c === first || c.classList.contains("done")) return;
    c.classList.add("up"); c.setAttribute("aria-label", c.dataset.s);
    if (!first) { first = c; return; }
    moves++;
    if (first.dataset.s === c.dataset.s) {
      first.classList.add("done"); c.classList.add("done"); pairs++; first = null;
      update(pairs === 8 ? "All matched in " + moves + " moves!" : "Nice!");
    } else {
      lock = true; var a = first; first = null; update("");
      setTimeout(function () { [a, c].forEach(function (x) { x.classList.remove("up"); x.setAttribute("aria-label", "Hidden card"); }); lock = false; }, 700);
    }
  }
  document.getElementById("again").onclick = deal;
  deal();
</script>
</body>
</html>
