<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marked Up: live markdown preview</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f1ea; color:#1e1d1a; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid #dcd6c8; background:#fbf9f4; }
  header b { font-size:16px; }
  header span { color:#76705f; font-size:13px; }
  .panes { flex:1; display:grid; grid-template-columns: 1fr 1fr; min-height:0; }
  textarea { border:0; border-right:1px solid #dcd6c8; padding:22px; font: 15px/1.7 "SF Mono", Menlo, Consolas, monospace; background:#fbf9f4; color:inherit; resize:none; outline:none; }
  .out { padding:22px 30px; overflow:auto; line-height:1.7; font-family: Georgia, serif; font-size:17px; background:#fff; }
  .out h1 { font-size:34px; margin:0 0 12px; } .out h2 { font-size:24px; margin:22px 0 8px; } .out h3 { font-size:19px; margin:18px 0 6px; }
  .out p { margin:0 0 12px; } .out ul { margin:0 0 12px 22px; }
  .out code { font-family: Menlo, monospace; font-size:.85em; background:#f1ede3; padding:2px 5px; border-radius:4px; }
  .out pre { background:#1e1d1a; color:#f4f1ea; padding:14px; border-radius:8px; overflow:auto; margin:0 0 12px; }
  .out pre code { background:none; color:inherit; padding:0; }
  .out blockquote { border-left:4px solid #c9a84c; padding-left:14px; color:#5d584b; margin:0 0 12px; font-style:italic; }
  .out a { color:#8a5a00; }
  @media (max-width: 700px) { .panes { grid-template-columns:1fr; grid-template-rows: 1fr 1fr; } textarea { border-right:0; border-bottom:1px solid #dcd6c8; } }
</style>
</head>
<body>
<header><b>Marked Up</b><span id="count"></span></header>
<div class="panes">
  <label for="src" style="position:absolute;left:-9999px">Markdown</label>
  <textarea id="src" spellcheck="false"># Trip notes

Packing list for **the coast**, in no particular order:

- rain jacket (it *will* rain)
- the good camera
- `sunscreen` x2

## Day one

> Leave early. The ferry fills up by 9.

Check the [tide table](https://example.com) before the cliff walk.

```
ferry: 08:15
return: 18:40
```
</textarea>
  <article class="out" id="out" aria-live="polite"></article>
</div>
<script>
  // A small, safe markdown renderer: escapes HTML first, then applies a handful of rules.
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inline(s) {
    return s.replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function render(md) {
    var out = [], lines = esc(md).split("\n"), i = 0, list = false;
    function closeList() { if (list) { out.push("</ul>"); list = false; } }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { closeList(); var code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); out.push("<pre><code>" + code.join("\n") + "</code></pre>"); i++; continue; }
      var h = /^(#{1,3})\s+(.*)/.exec(l);
      if (h) { closeList(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); }
      else if (/^[-*]\s+/.test(l)) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(l.replace(/^[-*]\s+/, "")) + "</li>"); }
      else if (/^&gt;\s?/.test(l)) { closeList(); out.push("<blockquote>" + inline(l.replace(/^&gt;\s?/, "")) + "</blockquote>"); }
      else if (l.trim()) { closeList(); out.push("<p>" + inline(l) + "</p>"); }
      else closeList();
      i++;
    }
    closeList();
    return out.join("");
  }
  var src = document.getElementById("src");
  function update() { document.getElementById("out").innerHTML = render(src.value); var w = src.value.trim().split(/\s+/).filter(Boolean).length; document.getElementById("count").textContent = w + " words"; }
  src.addEventListener("input", update); update();
</script>
</body>
</html>
