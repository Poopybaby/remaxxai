name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm isn't installed yet at this step, so skip setup-node's automatic package cache.
          package-manager-cache: false

      # pnpm comes from corepack, pinned by "packageManager" in package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds without any secrets, which proves the app doesn't need them at build time.
      - name: Build
        run: pnpm build

      - name: Scan client bundle for secrets
        run: pnpm check:bundle

  e2e:
    name: Browser smoke tests
    # Pinned: Playwright 1.56 installs browser dependencies for Ubuntu 24.04, not 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # A real Postgres with pgvector, like Supabase, so database code runs on the production driver.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare the database
        run: pnpm e2e:db

      - name: Build with test settings
        run: pnpm e2e:build

      - name: Smoke tests
        run: pnpm e2e

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
