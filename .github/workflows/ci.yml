name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm isn't installed yet at this step, so skip setup-node's automatic package cache.
          package-manager-cache: false

      # pnpm comes from corepack, pinned by "packageManager" in package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds without any secrets, which proves the app doesn't need them at build time.
      - name: Build
        run: pnpm build

      - name: Scan client bundle for secrets
        run: pnpm check:bundle
